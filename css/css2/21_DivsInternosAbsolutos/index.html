<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 - Divs Internos Absolutos</title>
    <style>
        html {
            background-color: yellow;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: red;
            margin: 0 40px;
            padding: 0;
            min-height: 1100px; 
            position: relative;
            font-family: Arial, sans-serif;
            padding-bottom: 60px;
        }

        h3 {
            margin: 0;
            padding: 10px;
            font-weight: bold;
        }

        #contenedorInterno1 {
            position: absolute;
            top: 60px;
            left: 8%;
            width: 28%;
            height: 350px;
            background-color: blue;
            font-size: 1vw;
            padding: 10px;
            box-sizing: border-box;
            z-index: 1;
        }

        #contenedorInterno2 {
            position: absolute;
            top: 420px;
            left: 40%;
            width: 42%;
            height: 680px; 
            background-color: gold;
            font-size: 1vw;
            padding: 15px;
            box-sizing: border-box;
            transform: rotate(7deg);
            z-index: 2;
        }

        .galeria-fotos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .galeria-fotos img {
            width: 29%;
            height: auto;
            border: 1px solid #fff;
        }

        #contenedorInterno3 {
            position: absolute;
            top: 180px;
            left: 24%;
            width: 44%;
            height: 520px;
            background-color: rgba(188, 192, 196, 0.65);
            font-size: 1vw;
            padding: 10px;
            box-sizing: border-box;
            z-index: 3;
        }
    </style>
</head>
<body>

    <h3>Festejos del River campeon de la Conmbelol Libertadores 2018 contra Boca en Madrid.</h3>

    <div id="contenedorInterno1">
        <strong>Te vacunaron.</strong><br>
        Golazo del Oso Pratto, Golazo de Juanfer y Golazo del Pity

    </div>

    <div id="contenedorInterno2">
        <strong>Tus papas.</strong><br>
        <div class="galeria-fotos">
            <img src="juanferlib2018" alt="Foto 1">
            <img src="pitylib2018" alt="Foto 2">
            <img src="enzolib2018" alt="Foto 3">
            <img src="julianlib2018" alt="Foto 4">
        </div>
    </div>

    <div id="contenedorInterno3">
        <strong>Moriste en Madrid bostero.</strong><br>
        No te la olvidas nunca mas. Abz
    </div>

</body>
</html>
